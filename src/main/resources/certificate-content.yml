# Содержание страхового сертификата INSON (ТЗ п. 9.2).
# Меняется без релиза кода: тексты покрытий, сроков и перечни документов.
# Персональные данные, номера полисов и количества приходят в сообщении очереди,
# объект страхования и формулировки рисков — из справочника INS_CENTRUM_AIR_POLICY_REF.
certificate:
  template-version: "1.0"
  number-prefix: CERT

  rabbit:
    exchange: insurance.certificate.exchange
    queue: insurance.certificate.queue
    routing-key: insurance.certificate.issue
    dead-letter-queue: insurance.certificate.queue.dlq
    dead-letter-routing-key: insurance.certificate.issue.dlq

  brand:
    insurer-name: "АО СО «INSON»"
    call-center: "1371"
    support-email: info@insuranceon.uz
    offer-url: https://insuranceon.uz/
    program-url: https://insuranceon.uz/
    claim-url: https://insuranceon.uz/claim
    logo-resource: certificate/logo.png

  assistance:
    name: SBR Global Assist
    schedule: "24/7 · Английский, узбекский"
    phone: "+90 (242) 606 10 77"
    email: operation@sbrassistance.com
    telegram: "+90 (541) 662 60 77"
    telegram-url: "https://t.me/+905416626077"
    whatsapp: "+90 (541) 662 60 77"
    whatsapp-url: "https://wa.me/905416626077"
    instructions:
      - "Немедленно позвоните на горячую линию ассистанса: +90 (242) 606 10 77 или напишите в чат."
      - "Сообщите: ваше имя, номер сертификата, страну и город, описание ситуации."
      - "Не обращайтесь в клинику самостоятельно без согласования — это может повлечь отказ в возмещении расходов."
      - "Если вы всё же оплатили лечение самостоятельно — сохраните все оригиналы счетов и медицинских документов и обратитесь в INSON после возвращения."

  mail:
    from: info@insuranceon.uz
    subject: "Ваш страховой полис"
    file-name-pattern: "INSON_CERT_%s.pdf"

  sections:
    TRAVEL:
      title: "МЕЖДУНАРОДНОЕ МЕДИЦИНСКОЕ СТРАХОВАНИЕ"
      coverage:
        - { title: "МЕДИЦИНСКИЕ УСЛУГИ — итого", limit: "45 000 EUR", level: 0 }
        - { title: "• Экстренная стоматология", limit: "500 EUR", level: 2 }
        - { title: "• Прочие медицинские услуги", limit: "44 500 EUR", level: 2 }
        - { title: "• COVID-19", limit: "Не покрывается", level: 2 }
        - { title: "ПРОЧИЕ УСЛУГИ — итого", limit: "45 000 EUR", level: 0 }
        - { title: "• Медицинская эвакуация", limit: "11 000 EUR", level: 2 }
        - { title: "• Проезд застрахованного", limit: "10 000 EUR", level: 2 }
        - { title: "• Поисково-спасательные мероприятия", limit: "4 000 EUR", level: 2 }
        - { title: "• Захоронение за рубежом", limit: "10 000 EUR", level: 2 }
        - { title: "• Репатриация", limit: "10 000 EUR", level: 2 }

    AVIA_STANDARD:
      title: "АВИАЦИОННЫЙ ПАКЕТ"
      territory: >-
        По риску «Несчастный случай» — воздушное судно, осуществляющее перевозку; пассажирские зоны
        аэропортов вылета и прилёта. По рискам «Отмена поездки», «Потеря документов», «Задержка рейса» — весь мир.
      term: >-
        По риску «Несчастный случай»: с момента прибытия Застрахованного на территорию аэропорта вылета и до
        момента выхода с территории аэропорта назначения. По риску «Отмена поездки»: с 00:00 вторых суток с даты
        заключения договора страхования и до момента начала последнего сегмента перевозки. По риску «Задержка
        рейса»: с 00:00 дня, предшествующего дню вылета, и до 24:00 дня, следующего за днём окончания перевозки.
        По риску «Утрата документов»: с момента заключения договора страхования и до окончания перевозки по
        последнему рейсу.
      coverage:
        - { title: "1. Несчастный случай во время перелёта:", limit: "7 500 EUR", level: 1 }
        - { title: "1.1. Инвалидность I / II / III группы во время перелёта", limit: "50 / 30 / 10 % от страховой суммы", level: 2 }
        - { title: "1.2. Травма во время перелёта", limit: "по таблице травм", level: 2 }
        - { title: "1.3. Уход из жизни во время перелёта", limit: "100%", level: 2 }
        - { title: "2. Отмена поездки", limit: "1 000 EUR", level: 1 }
        - { title: "3. Потеря документов", limit: "200 EUR", level: 1 }
      documents:
        - risk: "Несчастный случай"
          text: "выписка из истории болезни/амбулаторной карты; документ уполномоченного органа о факте события (при наличии); результаты диагностики (рентген, КТ, МРТ); справка ВТЭК об инвалидности; листки нетрудоспособности."
        - risk: "Отмена поездки"
          text: "документы об аннулировании/обмене билетов и о размере расходов (чеки, акты возврата); документ по причине отмены (справка о болезни/травме, свидетельство о смерти родственника, повестка, протокол ДТП и т.п.); документы, подтверждающие родство/совместную поездку."
        - risk: "Потеря документов"
          text: "новое удостоверение личности; справки посольства/консульства об утере и восстановлении; документы полиции о факте утери/кражи; чеки о расходах на оформление нового документа."

