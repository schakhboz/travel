    ADDON_BAGGAGE:
      title: "СТРАХОВАНИЕ ДОПОЛНИТЕЛЬНОГО БАГАЖА"
      term: "со дня первого сегмента перевозки и до дня последнего сегмента перевозки в рамках условий оферты страхования."
      documents:
        - risk: "Багаж"
          text: "Коммерческий акт о неисправности багажа (PIR) — оформляется на стойке представителя перевозчика в аэропорту прибытия до выхода из зоны выдачи багажа; билет и посадочный талон; багажные квитанции/бирки; документы о компенсации от перевозчика, если она была."

    ANIMAL:
      title: "СТРАХОВАНИЕ ПИТОМЦА НА ВРЕМЯ АВИАПЕРЕЛЁТА"
      term: "с момента прибытия Застрахованного питомца на территорию аэропорта вылета и до момента выхода с территории аэропорта назначения."
      coverage:
        - { title: "Гибель животного", limit: "3 000 EUR", level: 1 }
        - { title: "Травма животного", limit: "1 000 EUR", level: 1 }
      documents:
        - risk: "Питомец"
          text: "паспорт животного или номер чипа; ветеринарное свидетельство и документы о прививках (выдаёт ветклиника при регистрации/вакцинации питомца); документы перевозчика о перевозке животного."
