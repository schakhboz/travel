# Модуль выпуска Centrum Air (ТЗ п. 11: настройки меняются без релиза)
centrum-air:
  product-id: 352
  default-division-id: 90000
  eur-rate: 13500
  ersp:
    catalog: ERSP_VOLUNTARY_INTEGRATIONS
    issue-function: CONTRACT_TEST          # продуктив: CONTRACT
    confirm-function: CONFIRM_PAYED_TEST   # продуктив: CONFIRM_PAYED
    termination-function: POLICY_TERMINATION
  idempotency:
    in-progress-timeout: 5m
  validation:
    strict-product-rules: true
    # Премия, заявленная а/к, не может быть выше расчёта по тарифной матрице
    check-premium: true
    # Допуск на округление, UZS
    premium-tolerance: 0

# Очередь заявок на сертификат: документы готовит отдельный сервис (inson-certificate-service)
certificate:
  queue:
    exchange: insurance.certificate.exchange
    routing-key: insurance.certificate.issue
